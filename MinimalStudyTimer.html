<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Study Timer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input:focus {
            outline: none;
        }
        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ffffff;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ffffff;
        }

        /* Small sunflower in the bottom-right corner */
        .sunflower-decoration {
            position: fixed;
            right: 28px;
            bottom: -5px;
            width: 46px;
            height: auto;
            z-index: 45;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 480px) {
            .sunflower-decoration {
                right: 14px;
                bottom: 10px;
                width: 38px;
            }
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen flex items-center justify-center select-none relative overflow-hidden">

    <!-- Main Container Area -->
    <div id="timer-container" class="w-full max-w-md mx-4 p-8 rounded-3xl bg-black flex flex-col items-center justify-center text-center relative transition-all duration-300">
        
        <!-- Focus Task Input -->
        <div class="w-full mb-6">
            <input 
                type="text" 
                id="task-input" 
                placeholder="What do you want to focus on?" 
                class="w-full text-center bg-transparent text-zinc-400 placeholder-zinc-600 text-sm sm:text-base font-medium border-b border-transparent hover:border-zinc-800 focus:border-zinc-700 pb-2 transition-all"
            />
        </div>

        <!-- Mode Tabs & Cycle Indicator -->
        <div class="flex flex-col items-center mb-8">
            <div class="flex items-center justify-center space-x-6 text-xs font-semibold tracking-wider">
                <button onclick="switchMode('focus')" id="tab-focus" class="transition-colors text-white pb-1 border-b-2 border-white">FOCUS</button>
                <button onclick="switchMode('short')" id="tab-short" class="transition-colors text-zinc-500 pb-1 border-b-2 border-transparent hover:text-zinc-300">SHORT BREAK</button>
                <button onclick="switchMode('long')" id="tab-long" class="transition-colors text-zinc-500 pb-1 border-b-2 border-transparent hover:text-zinc-300 hidden">LONG BREAK</button>
            </div>
            <!-- Cycle progress dots -->
            <div id="cycle-dots-container" class="flex items-center justify-center space-x-2 mt-4">
                <!-- Dots populated by JS -->
            </div>
        </div>

        <!-- Timer Display -->
        <div class="mb-8">
            <h1 id="timer-display" class="text-7xl sm:text-8xl font-bold tracking-tighter text-white tabular-nums">25:00</h1>
        </div>

        <!-- Control Buttons -->
        <div class="flex items-center justify-center space-x-5">
            <!-- Settings Modal Button -->
            <button onclick="openSettings()" class="p-3.5 rounded-full bg-zinc-950 hover:bg-zinc-900 text-zinc-400 hover:text-white transition-all transform active:scale-95 border border-zinc-800" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>

            <!-- Play / Pause Button -->
            <button onclick="toggleTimer()" id="play-btn" class="p-4 rounded-full bg-zinc-900 hover:bg-zinc-800 text-white transition-all transform active:scale-95 border border-zinc-800 shadow-lg">
                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>

            <!-- Reset Button -->
            <button onclick="resetTimer()" class="p-3.5 rounded-full bg-zinc-950 hover:bg-zinc-900 text-zinc-400 hover:text-white transition-all transform active:scale-95 border border-zinc-800" title="Reset">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>

            <!-- Fullscreen Button -->
            <button onclick="toggleFullscreen()" class="p-3.5 rounded-full bg-zinc-950 hover:bg-zinc-900 text-zinc-400 hover:text-white transition-all transform active:scale-95 border border-zinc-800" title="Fullscreen">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>

    </div>

        id="sunflower-decoration"
        class="sunflower-decoration"

    <!-- Settings Overlay Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-950 border border-zinc-800 p-6 sm:p-8 rounded-2xl w-full max-w-sm text-left shadow-2xl">
            <h2 class="text-base font-semibold mb-6 text-white tracking-wide border-b border-zinc-800 pb-3 flex justify-between items-center">
                <span>Timer Settings</span>
                <button onclick="closeSettings()" class="text-zinc-500 hover:text-white text-sm">✕</button>
            </h2>

            <!-- Focus Time Input -->
            <div class="mb-4 flex items-center justify-between">
                <label class="text-xs font-medium text-zinc-400">Focus Duration (mins)</label>
                <input type="number" id="input-focus" min="1" max="180" value="25" class="w-20 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-center text-sm text-white focus:border-zinc-600 transition-all"/>
            </div>

            <!-- Short Break Input -->
            <div class="mb-4 flex items-center justify-between">
                <label class="text-xs font-medium text-zinc-400">Short Break (mins)</label>
                <input type="number" id="input-short" min="1" max="60" value="5" class="w-20 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-center text-sm text-white focus:border-zinc-600 transition-all"/>
            </div>

            <!-- Enable Long Break Toggle -->
            <div class="mb-4 flex items-center justify-between pt-2 border-t border-zinc-900">
                <label class="text-xs font-medium text-zinc-400">Enable Long Break</label>
                <input type="checkbox" id="input-enable-long" onchange="toggleLongBreakInput()" class="w-4 h-4 rounded bg-zinc-900 border-zinc-800 text-white accent-white cursor-pointer"/>
            </div>

            <!-- Long Break Settings Container -->
            <div id="long-break-settings" class="space-y-4 hidden">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-medium text-zinc-400">Long Break (mins)</label>
                    <input type="number" id="input-long" min="1" max="120" value="15" class="w-20 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-center text-sm text-white focus:border-zinc-600 transition-all"/>
                </div>

                <div class="flex items-center justify-between">
                    <label class="text-xs font-medium text-zinc-400">Long Break Interval (cycles)</label>
                    <input type="number" id="input-interval" min="1" max="10" value="4" class="w-20 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-center text-sm text-white focus:border-zinc-600 transition-all"/>
                </div>
            </div>

            <!-- Auto Switch Toggle -->
            <div class="mb-6 flex items-center justify-between pt-2 border-t border-zinc-900">
                <label class="text-xs font-medium text-zinc-400">Auto-start Breaks</label>
                <input type="checkbox" id="input-auto-start" checked class="w-4 h-4 rounded bg-zinc-900 border-zinc-800 text-white accent-white cursor-pointer"/>
            </div>

            <!-- Save / Apply Button -->
            <button onclick="saveSettings()" class="w-full py-2.5 rounded-xl bg-white text-black font-semibold text-xs tracking-wider uppercase hover:bg-zinc-200 transition-all active:scale-98">
                Save & Apply
            </button>
        </div>
    </div>

    <script>
        // State Configuration
        let config = {
            focus: 25,
            short: 5,
            long: 15,
            enableLongBreak: false,
            interval: 4,
            autoStart: true
        };

        let currentMode = 'focus'; // 'focus' | 'short' | 'long'
        let currentCycle = 1; // Tracks focus cycles (1 to config.interval)
        let timeLeft = config.focus * 60;
        let timerId = null;
        let isRunning = false;

        // Elements
        const timerDisplay = document.getElementById('timer-display');
        const playIcon = document.getElementById('play-icon');
        const tabFocus = document.getElementById('tab-focus');
        const tabShort = document.getElementById('tab-short');
        const tabLong = document.getElementById('tab-long');
        const settingsModal = document.getElementById('settings-modal');
        const longBreakSettings = document.getElementById('long-break-settings');
        const cycleDotsContainer = document.getElementById('cycle-dots-container');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            const modeName = currentMode === 'focus' ? 'Focus' : (currentMode === 'short' ? 'Short Break' : 'Long Break');
            document.title = `${formatTime(timeLeft)} - ${modeName}`;
            updateCycleDots();
        }

        function updateCycleDots() {
            if (!config.enableLongBreak) {
                cycleDotsContainer.innerHTML = '';
                return;
            }

            let dotsHtml = '';
            for (let i = 1; i <= config.interval; i++) {
                if (i < currentCycle) {
                    dotsHtml += `<div class="w-2 h-2 rounded-full bg-white"></div>`; // Completed focus session
                } else if (i === currentCycle && currentMode === 'focus') {
                    dotsHtml += `<div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>`; // Active focus
                } else {
                    dotsHtml += `<div class="w-2 h-2 rounded-full bg-zinc-800"></div>`; // Upcoming
                }
            }
            cycleDotsContainer.innerHTML = dotsHtml;
        }

        function switchMode(mode, manual = true) {
            if (manual && isRunning) {
                pauseTimer();
            }
            
            currentMode = mode;
            timeLeft = config[mode] * 60;

            // Tab highlight visibility
            [tabFocus, tabShort, tabLong].forEach(tab => {
                tab.className = "transition-colors text-zinc-500 pb-1 border-b-2 border-transparent hover:text-zinc-300";
            });

            if (config.enableLongBreak) {
                tabLong.classList.remove('hidden');
            } else {
                tabLong.classList.add('hidden');
            }

            const activeTab = document.getElementById(`tab-${mode}`);
            if (activeTab) {
                activeTab.className = "transition-colors text-white pb-1 border-b-2 border-white";
            }

            updateDisplay();
        }

        function handleSessionCompletion() {
            pauseTimer();
            playChime();

            if (!config.enableLongBreak) {
                // Alternates simple focus -> short break
                if (currentMode === 'focus') {
                    switchMode('short', false);
                } else {
                    switchMode('focus', false);
                }
            } else {
                // Complex cycle logic with Long Break
                if (currentMode === 'focus') {
                    if (currentCycle >= config.interval) {
                        // Reached maximum intervals -> Trigger Long Break
                        switchMode('long', false);
                        currentCycle = 1; // Reset cycle tracker
                    } else {
                        // Switch to regular Short Break
                        switchMode('short', false);
                    }
                } else if (currentMode === 'short') {
                    // After short break, advance cycle and return to focus
                    currentCycle++;
                    switchMode('focus', false);
                } else if (currentMode === 'long') {
                    // After long break, reset to focus
                    currentCycle = 1;
                    switchMode('focus', false);
                }
            }

            if (config.autoStart) {
                startTimer();
            }
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon

            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    handleSessionCompletion();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = config[currentMode] * 60;
            updateDisplay();
        }

        function openSettings() {
            document.getElementById('input-focus').value = config.focus;
            document.getElementById('input-short').value = config.short;
            document.getElementById('input-long').value = config.long;
            document.getElementById('input-interval').value = config.interval;
            document.getElementById('input-enable-long').checked = config.enableLongBreak;
            document.getElementById('input-auto-start').checked = config.autoStart;

            toggleLongBreakInput();
            settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        function toggleLongBreakInput() {
            const enableLong = document.getElementById('input-enable-long').checked;
            if (enableLong) {
                longBreakSettings.classList.remove('hidden');
                tabLong.classList.remove('hidden');
            } else {
                longBreakSettings.classList.add('hidden');
                tabLong.classList.add('hidden');
            }
        }

        let isPseudoFullscreen = false;

        function saveSettings() {
            const newFocus = parseInt(document.getElementById('input-focus').value) || 25;
            const newShort = parseInt(document.getElementById('input-short').value) || 5;
            const newLong = parseInt(document.getElementById('input-long').value) || 15;
            const newInterval = parseInt(document.getElementById('input-interval').value) || 4;
            const enableLong = document.getElementById('input-enable-long').checked;
            const autoStart = document.getElementById('input-auto-start').checked;

            config = {
                focus: Math.max(1, newFocus),
                short: Math.max(1, newShort),
                long: Math.max(1, newLong),
                interval: Math.max(1, newInterval),
                enableLongBreak: enableLong,
                autoStart: autoStart
            };

            currentCycle = 1;
            closeSettings();
            switchMode(currentMode, true);
        }

        async function toggleFullscreen() {
            // Prefer the browser's real fullscreen mode, falling back to an
            // app-level fullscreen layout if the browser blocks the Fullscreen API.
            if (document.fullscreenElement || isPseudoFullscreen) {
                try {
                    if (document.fullscreenElement && document.exitFullscreen) {
                        await document.exitFullscreen();
                    }
                } catch (err) {
                    console.warn("Could not exit browser fullscreen:", err);
                }
                disablePseudoFullscreen();
                return;
            }

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                    return;
                }
            } catch (err) {
                console.warn("Browser fullscreen unavailable; using app fullscreen:", err);
            }

            enablePseudoFullscreen();
        }

        function enablePseudoFullscreen() {
            const container = document.getElementById('timer-container');
            isPseudoFullscreen = true;

            // Fill the viewport and remove the normal centered-card constraints.
            container.classList.add('fixed', 'inset-0', 'z-40', 'max-w-none', 'm-0', 'rounded-none');
            container.classList.remove('max-w-md', 'mx-4', 'rounded-3xl');
            container.style.width = '100vw';
            container.style.height = '100dvh';
            container.style.maxWidth = 'none';
            container.style.backgroundColor = '#000000';
            container.style.padding = '2rem';
        }

        function disablePseudoFullscreen() {
            const container = document.getElementById('timer-container');
            isPseudoFullscreen = false;

            container.classList.remove('fixed', 'inset-0', 'z-40', 'max-w-none', 'm-0', 'rounded-none');
            container.classList.add('max-w-md', 'mx-4', 'rounded-3xl');
            container.style.width = '';
            container.style.height = '';
            container.style.maxWidth = '';
            container.style.backgroundColor = '';
            container.style.padding = '';
        }

        document.addEventListener('fullscreenchange', () => {
            // Keep our fallback state in sync if the user exits with Esc.
            if (!document.fullscreenElement && !isPseudoFullscreen) return;
            if (!document.fullscreenElement && isPseudoFullscreen) return;
            if (document.fullscreenElement) {
                disablePseudoFullscreen();
            }
        });

        // Escape exits the app-level fallback fullscreen.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isPseudoFullscreen) {
                disablePseudoFullscreen();
            }
        });

        // Web Audio chime generator
        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Play double chime
                const createNote = (freq, startTime, duration) => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                    
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime + startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + duration);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start(audioCtx.currentTime + startTime);
                    oscillator.stop(audioCtx.currentTime + startTime + duration);
                };

                createNote(523.25, 0, 0.6);   // C5
                createNote(659.25, 0.2, 0.8); // E5
            } catch (e) {
                // Audio context not allowed or supported
            }
        }

        // Initial setup
        updateDisplay();
    </script>
</body>
</html>
